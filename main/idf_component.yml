dependencies:
  idf: ">=5.5"
  # Board support: MIPI-DSI panel, GT911 touch, backlight, LVGL adapter.
  # KR_BSP is set by the top-level CMakeLists.txt from BOARD (see boards/).
  waveshare/esp32_p4_wifi6_touch_lcd_5:      # 5": HX8394
    version: "^1.0.4"
    rules:
      - if: "$KR_BSP == lcd5"
  waveshare/esp32_p4_wifi6_touch_lcd_x:      # 7": ILI9881C, 8" and 10.1": JD9365
    version: "^2.0.3"
    rules:
      - if: "$KR_BSP == lcdx"
  lvgl/lvgl:
    version: "9.5.0"
    public: true
  # Wi-Fi lives on the onboard ESP32-C6 (SDIO). These ranges match the C6
  # firmware Waveshare ships (see their docs/P4_C6_HOSTED_WIFI.md).
  espressif/esp_wifi_remote: "0.14.*"
  espressif/esp_hosted: "1.4.*"
  espressif/mdns: "^1.8"
