dependencies:
  idf: ">=5.5"
  # Board support: HX8394 MIPI-DSI panel, GT911 touch, backlight, LVGL adapter.
  waveshare/esp32_p4_wifi6_touch_lcd_5: "^1.0.4"
  lvgl/lvgl:
    version: "9.5.0"
    public: true
  # Wi-Fi lives on the onboard ESP32-C6 (SDIO). These ranges match the C6
  # firmware Waveshare ships (see their docs/P4_C6_HOSTED_WIFI.md).
  espressif/esp_wifi_remote: "0.14.*"
  espressif/esp_hosted: "1.4.*"
  espressif/mdns: "^1.8"
